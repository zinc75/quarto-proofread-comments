title: Quarto Comments
author: "Vincent Grégoire, Eric Bavu"
version: 0.7.0
quarto-required: ">=1.5.0"
metadata-keys:
  - extensions
contributes:
  shortcodes:
    - shortcodes.lua
  filters:
    # post-quarto so the filter sees expanded shortcodes: shortcodes.lua emits
    # transient .qtc-marker spans during expansion (after pre-quarto filters), and
    # this unified filter does all rendering + preamble/asset injection.
    - at: post-quarto
      path: comments.lua
