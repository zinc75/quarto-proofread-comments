title: Quarto Comments
author: "Vincent Grégoire, Eric Bavu"
version: 0.4.0
quarto-required: ">=1.5.0"
metadata-keys:
  - extensions
contributes:
  shortcodes:
    - shortcodes.lua
  filters:
    # post-quarto so the filter sees expanded shortcodes (placeholders are
    # produced during shortcode expansion, which runs after pre-quarto filters).
    - at: post-quarto
      path: comment-hoist.lua
  formats:
    html:
      css:
        - assets/comments.css
