title: Quarto Comments
author: "Vincent Grégoire, Eric Bavu"
version: 0.8.0
quarto-required: ">=1.5.0"
metadata-keys:
  - extensions
contributes:
  filters:
    # post-quarto: the single rendering filter. Input is the pandoc bracketed-span
    # syntax [text]{.comment author=… note=… type=…} (empty bracket = inserted
    # comment, non-empty = highlight + note). The filter does all rendering and the
    # preamble/asset injection.
    - at: post-quarto
      path: comments.lua
