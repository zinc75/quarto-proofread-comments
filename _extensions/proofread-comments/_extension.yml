title: Quarto Proofread Comments
author: "Vincent Grégoire, Éric Bavu"
version: 1.0.0
quarto-required: ">=1.5.0"
metadata-keys:
  - extensions
contributes:
  filters:
    # post-quarto: the single rendering filter. Input is the pandoc bracketed-span
    # syntax [text]{.comment by=… remark=… type=…} (empty bracket = inserted
    # comment, non-empty = highlight + note). The filter does all rendering and the
    # preamble/asset injection.
    - at: post-quarto
      path: filter.lua
